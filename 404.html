<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayfa bulunamadı</title>
<style>
:root{--bg:#EFEDEA;--ink:#1A1714;--muted:#5E5750;--accent:#1F3FBF}
@media (prefers-color-scheme: dark){:root{--bg:#000;--ink:#F4F1EC;--muted:#A69E94;--accent:#8EA8FF}}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px;box-sizing:border-box}
main{max-width:420px;text-align:center}
h1{font-size:1.4rem;margin:0 0 .5rem}
p{color:var(--muted);margin:0 0 1.2rem}
a{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<main>
<h1>Sayfa bulunamadı</h1>
<p>Aradığın sayfa bu sitede yok.</p>
<a href="/">Kapadokya 63K Planlayıcı'ya dön</a>
</main>
</body>
</html>
