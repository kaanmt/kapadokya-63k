# Kapadokya 63K: statik site, derleme yok. Dosyalar depo kökünden yayınlanır.
[build]
  publish = "."
  command = ""

# Geliştirme dosyaları depoda durur ama sitede yayınlanmaz (404 döner).
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.gitignore"
  to = "/404.html"
  status = 404
  force = true
